[project]
name = "breakdetect"
version = "0.1.0"
description = "Offline commercial-break point detector for TV episodes"
requires-python = ">=3.12"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
breakdetect = "breakdetect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["breakdetect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
